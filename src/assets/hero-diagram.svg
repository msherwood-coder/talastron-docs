  <circle cx="110" cy="230" r="28" fill="#0d1e3a" stroke="#1e6bff" stroke-width="1.5"/>
  <text x="110" y="227" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#60a5fa" font-weight="600">Deploy</text>
  <text x="110" y="239" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#4d6a96">Step 6</text>

