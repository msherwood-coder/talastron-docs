  <text x="300" y="210" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#4d6a96">01</text>

  <!-- Nodes -->
  <!-- Requirements -->
  <circle cx="300" cy="80" r="28" fill="#0d1e3a" stroke="#1e6bff" stroke-width="1.5"/>
  <text x="300" y="77" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#60a5fa" font-weight="600">Requirements</text>
  <text x="300" y="89" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#4d6a96">Step 1</text>

  <!-- Architecture -->
  <circle cx="460" cy="130" r="28" fill="#0d1e3a" stroke="#1e6bff" stroke-width="1.5"/>
  <text x="460" y="127" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#60a5fa" font-weight="600">Architecture</text>
  <text x="460" y="139" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#4d6a96">Step 2</text>

  <!-- Governance -->
  <circle cx="490" cy="230" r="28" fill="#0d1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="490" y="227" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#60a5fa" font-weight="600">Governance</text>
  <text x="490" y="239" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#4d6a96">Step 3.5</text>

  <!-- IaC Plan -->
  <circle cx="400" cy="330" r="28" fill="#0d1e3a" stroke="#1e6bff" stroke-width="1.5"/>
  <text x="400" y="327" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#60a5fa" font-weight="600">IaC Plan</text>
  <text x="400" y="339" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#4d6a96">Step 4</text>

  <!-- IaC Code -->
  <circle cx="200" cy="330" r="28" fill="#0d1e3a" stroke="#1e6bff" stroke-width="1.5"/>
  <text x="200" y="327" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#60a5fa" font-weight="600">IaC Code</text>
  <text x="200" y="339" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#4d6a96">Step 5</text>

