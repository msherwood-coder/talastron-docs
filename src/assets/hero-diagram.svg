  <text x="140" y="139" text-anchor="middle" font-family="Inter,sans-serif" font-size="8" fill="#4d6a96">Step 7</text>

  <!-- Connecting lines -->
  <line x1="300" y1="108" x2="300" y2="160" stroke="#1e6bff" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="324" y1="172" x2="433" y2="148" stroke="#1e6bff" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="339" y1="205" x2="462" y2="205" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="326" y1="228" x2="374" y2="303" stroke="#1e6bff" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="274" y1="228" x2="226" y2="303" stroke="#1e6bff" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="261" y1="205" x2="138" y2="205" stroke="#1e6bff" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <line x1="276" y1="172" x2="167" y2="148" stroke="#1e6bff" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Gate indicators -->
  <rect x="288" y="118" width="24" height="12" rx="3" fill="#1a2d50" stroke="#1e6bff" stroke-width="1"/>
  <text x="300" y="128" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#60a5fa">G1</text>

  <rect x="435" y="155" width="24" height="12" rx="3" fill="#1a2d50" stroke="#1e6bff" stroke-width="1"/>
  <text x="447" y="165" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" fill="#60a5fa">G2</text>

  <!-- Human approval label -->
  <rect x="220" y="355" width="160" height="20" rx="4" fill="#0a1628" stroke="#253552" stroke-width="1"/>
  <text x="300" y="369" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="#4d6a96">5 human approval gates</text>
</svg>
