<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" fill="#060e1e"/>

  <!-- Central hub -->
  <circle cx="300" cy="200" r="40" fill="#0d1e3a" stroke="#1e6bff" stroke-width="2"/>
